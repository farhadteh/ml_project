[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ml-project"
version = "0.1.0"
description = "Machine learning project template"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Farhad" }]
license = { file = "LICENSE" }
keywords = ["machine-learning", "template", "uv"]

# Runtime deps (kept lean). Dev tools go in dependency groups.
dependencies = [
  # Core ML and Data Processing
  "numpy>=1.26,<2.0",  # Pin to 1.x for PyTorch compatibility
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  # Deep Learning & NLP (moved heavy deps to optional group 'dl')
  "huggingface_hub>=0.19",
  "safetensors>=0.4",
  "spacy>=3.7",
  # openai-clip depends on torch; kept in optional group
  # Search & Ranking
  "rank-bm25==0.2.2",
  "lightgbm>=4.2",
  # "faiss-cpu>=1.7",  # Requires SWIG for compilation
  # Web Interface & Visualization
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "streamlit>=1.28",
  # System Infrastructure & Utilities
  "redis>=5.0",
  "scipy>=1.11",
  "tqdm>=4.66",
  # Configuration & Testing
  "PyYAML>=6.0",
  "pytest>=8.2",
  "pre-commit>=3.7",
  "jupyter>=1.0"
]

[dependency-groups]
# Install with: uv sync --group dev  (README shows how)
dev = [
  "black>=24.4",
  "ruff>=0.4",
  "isort>=5.13",
  "mypy>=1.10",
  "ipykernel>=6.29"
]
dl = [
  # Pin versions known to work on macOS x86_64
  "torch==2.2.2",
  "torchvision==0.17.2",
  "openai-clip>=1.0",
  "transformers>=4.36",
  "sentence-transformers>=2.2",
]

[tool.hatch.build.targets.wheel]
# Package the src module to allow editable installs
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks/", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
install_types = true
non_interactive = true
